<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UI 컴포넌트 · board-study</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body class="min-h-screen flex flex-col">

  <header class="site-header">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="board/index.html" class="shrink-0"><img src="../image/logo.svg" alt="board-study" class="h-8"></a>
      <button type="button" data-nav-toggle class="hidden mobile:block text-gray-700" aria-controls="site-nav" aria-expanded="false">메뉴</button>
      <nav id="site-nav" data-nav-menu class="site-header__nav flex items-center gap-4">
        <a href="board/index.html" class="text-gray-700 hover:text-blue-600">게시판</a>
        <a href="board/post-write.html" class="text-gray-700 hover:text-blue-600">글쓰기</a>
        <a href="auth/login.html" class="text-gray-700 hover:text-blue-600">로그인</a>
      </nav>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-6 flex-1">
    <h1 class="text-2xl font-bold text-gray-900 mb-1">UI 컴포넌트</h1>
    <p class="text-gray-500 mb-8">피드백·알림 컴포넌트 데모 (docs/ui-publishing/ui-guide.md 참조)</p>

    <!-- Toast -->
    <section class="rounded border border-gray-200 bg-white p-6 mb-6">
      <h2 class="text-lg font-semibold text-gray-900 mb-4">Toast</h2>
      <div class="flex flex-wrap gap-2">
        <button type="button" data-toast="success" data-toast-message="게시글이 등록되었습니다." class="rounded bg-green-600 px-4 py-2 text-sm font-semibold text-white hover:bg-green-700">성공</button>
        <button type="button" data-toast="error" data-toast-message="삭제에 실패했습니다." class="rounded bg-red-600 px-4 py-2 text-sm font-semibold text-white hover:bg-red-700">오류</button>
        <button type="button" data-toast="info" data-toast-message="임시저장되었습니다." class="rounded bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">정보</button>
        <button type="button" data-toast="warning" data-toast-message="제목을 입력하세요." class="rounded bg-amber-600 px-4 py-2 text-sm font-semibold text-white hover:bg-amber-700">경고</button>
      </div>
    </section>

    <!-- Confirm -->
    <section class="rounded border border-gray-200 bg-white p-6 mb-6">
      <h2 class="text-lg font-semibold text-gray-900 mb-4">Confirm (삭제 확인)</h2>
      <button type="button" data-modal-open="confirm-modal" class="rounded border border-red-300 px-4 py-2 text-sm text-red-600 hover:bg-red-50">게시글 삭제</button>
    </section>

    <!-- Inline validation -->
    <section class="rounded border border-gray-200 bg-white p-6 mb-6">
      <h2 class="text-lg font-semibold text-gray-900 mb-4">Inline validation</h2>
      <form class="space-y-4" onsubmit="return false">
        <div class="field">
          <label class="field__label" for="demo-ok">정상 입력</label>
          <input id="demo-ok" type="text" class="field__input" value="hello">
        </div>
        <div class="field">
          <label class="field__label" for="demo-err">오류 입력</label>
          <input id="demo-err" type="text" class="field__input field__input--error" value="" aria-invalid="true" aria-describedby="demo-err-msg">
          <p id="demo-err-msg" class="field__error" role="alert">필수 입력 항목입니다.</p>
        </div>
      </form>
    </section>

    <!-- Empty -->
    <section class="rounded border border-gray-200 bg-white p-6">
      <h2 class="text-lg font-semibold text-gray-900 mb-4">Empty state</h2>
      <div class="empty">
        <p class="empty__title">게시글이 없습니다</p>
        <p class="empty__desc">첫 게시글을 작성해 보세요.</p>
        <a href="board/post-write.html" class="rounded bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">글쓰기</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="max-w-6xl mx-auto px-4 py-4 text-sm text-gray-500">© 2026 board-study</div>
  </footer>

  <!-- 삭제 확인 모달 -->
  <div class="modal" id="confirm-modal" hidden>
    <div class="modal__overlay" data-modal-close></div>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <h2 id="confirm-title" class="modal__title">게시글을 삭제하시겠습니까?</h2>
      <p class="modal__body">삭제한 게시글은 되돌릴 수 없습니다.</p>
      <div class="modal__actions">
        <button type="button" class="rounded border border-gray-300 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50" data-modal-close>취소</button>
        <button type="button" class="rounded bg-red-600 px-4 py-2 text-sm font-semibold text-white hover:bg-red-700" data-modal-close>삭제</button>
      </div>
    </div>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
