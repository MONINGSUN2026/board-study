<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게시글 작성 · board-study</title>
  <link rel="stylesheet" href="../../css/main.css">
</head>
<body class="min-h-screen flex flex-col">

  <header class="site-header">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="shrink-0"><img src="../../image/logo.svg" alt="board-study" class="h-8"></a>
      <button type="button" data-nav-toggle class="hidden mobile:block text-gray-700" aria-controls="site-nav" aria-expanded="false">메뉴</button>
      <nav id="site-nav" data-nav-menu class="site-header__nav flex items-center gap-4">
        <a href="index.html" class="text-gray-700 hover:text-blue-600">게시판</a>
        <a href="post-write.html" class="font-semibold text-blue-600">글쓰기</a>
        <a href="../auth/login.html" class="text-gray-700 hover:text-blue-600">로그인</a>
      </nav>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-6 flex-1">

    <h1 class="text-2xl font-bold text-gray-900 mb-6">게시글 작성</h1>

    <form class="rounded border border-gray-200 bg-white p-6 space-y-4">
      <div class="flex flex-wrap gap-4">
        <select class="w-40 rounded border border-gray-300 bg-white px-3 py-2 text-sm">
          <option>전체 카테고리</option>
          <option>공지</option>
          <option>자유</option>
          <option>질문</option>
        </select>
        <input type="text" placeholder="제목" class="flex-1 rounded border border-gray-300 px-3 py-2 text-sm">
      </div>

      <input type="text" placeholder="태그 (쉼표로 구분)" class="w-full rounded border border-gray-300 px-3 py-2 text-sm">

      <textarea rows="12" placeholder="본문을 입력하세요" class="w-full rounded border border-gray-300 px-3 py-2 text-sm leading-relaxed"></textarea>

      <div>
        <button type="button" class="rounded border border-gray-300 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">이미지 업로드</button>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button type="button" class="rounded border border-gray-300 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">임시저장</button>
        <button type="submit" class="rounded bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">등록</button>
        <a href="index.html" class="rounded border border-gray-300 px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">취소</a>
      </div>
    </form>

  </main>

  <footer class="site-footer">
    <div class="max-w-6xl mx-auto px-4 py-4 text-sm text-gray-500">© 2026 board-study</div>
  </footer>

  <script src="../../js/main.js"></script>
</body>
</html>
