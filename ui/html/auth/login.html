<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · board-study</title>
  <link rel="stylesheet" href="../../css/main.css">
</head>
<body class="min-h-screen flex flex-col">

  <header class="site-header">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="../board/index.html" class="shrink-0"><img src="../../image/logo.svg" alt="board-study" class="h-8"></a>
      <button type="button" data-nav-toggle class="hidden mobile:block text-gray-700" aria-controls="site-nav" aria-expanded="false">메뉴</button>
      <nav id="site-nav" data-nav-menu class="site-header__nav flex items-center gap-4">
        <a href="../board/index.html" class="text-gray-700 hover:text-blue-600">게시판</a>
        <a href="../board/post-write.html" class="text-gray-700 hover:text-blue-600">글쓰기</a>
        <a href="login.html" class="font-semibold text-blue-600">로그인</a>
      </nav>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-6 flex-1 flex items-start justify-center">
    <div class="w-full max-w-sm mt-16">
      <h1 class="text-2xl font-bold text-gray-900 mb-6 text-center">로그인</h1>

      <form class="rounded border border-gray-200 bg-white p-6 space-y-4">
        <div class="field">
          <label for="username" class="field__label">아이디</label>
          <input id="username" type="text" class="field__input">
        </div>
        <div class="field">
          <label for="password" class="field__label">비밀번호</label>
          <input id="password" type="password" class="field__input">
        </div>
        <button type="submit" class="w-full rounded bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700">로그인</button>
      </form>

      <p class="text-center text-sm text-gray-500 mt-4">
        계정이 없으신가요? <a href="signup.html" class="text-blue-600 hover:underline">회원가입</a>
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="max-w-6xl mx-auto px-4 py-4 text-sm text-gray-500">© 2026 board-study</div>
  </footer>

  <script src="../../js/main.js"></script>
</body>
</html>
